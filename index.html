<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fatima Lari — UX/UI Designer</title>
  <meta name="description" content="Fatima Lari is a UX/UI designer based in Debrecen, Hungary.">
  <link rel="preload" href="fonts/poppins-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/main.css">
  <script>
    /* Show the preloader once per visit, and never for reduced-motion users */
    (function () {
      var seen = false;
      try { seen = sessionStorage.getItem("preloader-seen") === "1"; } catch (e) {}
      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (!seen && !reduce) document.documentElement.classList.add("is-loading");
    })();
  </script>
  <script src="js/preloader.js" defer></script>
</head>
<body>
  <div class="preloader" aria-hidden="true">
    <div class="preloader__center">
      <span class="preloader__title">Fatima Lari – <span class="nowrap">UX/UI Designer</span></span>
      <span class="preloader__count">0%</span>
    </div>
    <span class="preloader__bar"><span class="preloader__bar-fill"></span></span>
  </div>

  <header class="site-header">
    <a class="site-header__logo" href="./">Fatima Lari</a>
    <nav class="site-header__nav" aria-label="Main">
      <a href="#about">About</a>
      <a href="resume.pdf" download>Resume</a>
    </nav>
  </header>

  <main>
    <section class="hero" aria-label="Introduction">
      <div class="hero__content">
        <h1 class="hero__title">
          <span class="hero__line">
            Hello!
            <span class="hero__media" aria-hidden="true"></span>
            I’m Fatima Lari
          </span>
          <span class="hero__line">a UX/UI designer, based in Debrecen</span>
        </h1>
      </div>

      <!-- TODO: replace # with your LinkedIn and Instagram profile URLs -->
      <ul class="social" aria-label="Social media">
        <li>
          <a class="social__link" href="#" target="_blank" rel="noopener" aria-label="LinkedIn">
            <svg viewBox="0 0 44 44" width="44" height="44" aria-hidden="true">
              <rect width="44" height="44" rx="8" fill="currentColor"/>
              <g fill="none" stroke="#fff" stroke-width="4.5">
                <path d="M13 19v14M21.5 33V19M21.5 26c0-3.6 2.2-6.5 5.5-6.5s5.5 2.4 5.5 6.5v7"/>
              </g>
              <circle cx="13" cy="12.5" r="2.75" fill="#fff"/>
            </svg>
          </a>
        </li>
        <li>
          <a class="social__link" href="#" target="_blank" rel="noopener" aria-label="Instagram">
            <svg viewBox="0 0 44 44" width="44" height="44" aria-hidden="true">
              <rect width="44" height="44" rx="12" fill="currentColor"/>
              <g fill="none" stroke="#fff" stroke-width="3">
                <rect x="10.5" y="10.5" width="23" height="23" rx="7"/>
                <circle cx="22" cy="22" r="5.5"/>
              </g>
              <circle cx="28.5" cy="15.5" r="1.75" fill="#fff"/>
            </svg>
          </a>
        </li>
      </ul>
    </section>
  </main>
</body>
</html>
