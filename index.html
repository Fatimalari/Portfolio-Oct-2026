<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fatima Lari — UX/UI Designer</title>
  <meta name="description" content="Fatima Lari is a UX/UI designer based in Debrecen, Hungary.">
  <link rel="preload" href="fonts/poppins-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/main.css">
  <script>
    /* Show the preloader once per visit, and never for reduced-motion users */
    (function () {
      var seen = false;
      try { seen = sessionStorage.getItem("preloader-seen") === "1"; } catch (e) {}
      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (!seen && !reduce) document.documentElement.classList.add("is-loading");
    })();
  </script>
  <script src="js/preloader.js" defer></script>
</head>
<body>
  <div class="preloader" aria-hidden="true">
    <div class="preloader__center">
      <span class="preloader__title">Fatima Lari – <span class="nowrap">UX/UI Designer</span></span>
      <span class="preloader__count">0%</span>
    </div>
    <span class="preloader__bar"><span class="preloader__bar-fill"></span></span>
  </div>

  <header class="site-header">
    <a class="site-header__logo" href="./">Fatima Lari</a>
    <nav class="site-header__nav" aria-label="Main">
      <a href="#about">About</a>
      <a href="resume.pdf" download>Resume</a>
    </nav>
  </header>

  <main>
    <section class="hero" aria-label="Introduction">
      <h1 class="hero__title">
        <span class="hero__line">
          Hello!
          <span class="hero__media" aria-hidden="true"></span>
          I’m Fatima Lari
        </span>
        <span class="hero__line">a UX/UI designer, based in Debrecen</span>
      </h1>
    </section>
  </main>
</body>
</html>
